name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Assemble TomeScanner APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Restore debug keystore
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Assemble Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename Debug APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/TomeScanner-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TomeScanner-debug-apk
          path: artifacts/TomeScanner-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Assemble Release APK & AAB (when signing secrets are set)
        if: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.STORE_PASSWORD != '' && secrets.KEY_PASSWORD != '' }}
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$KEYSTORE_PATH"
          gradle :app:assembleRelease :app:bundleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk artifacts/TomeScanner-release.apk
          cp app/build/outputs/bundle/release/app-release.aab artifacts/TomeScanner-release.aab

      - name: Upload Release Artifacts
        if: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.STORE_PASSWORD != '' && secrets.KEY_PASSWORD != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: TomeScanner-release-artifacts
          path: |
            artifacts/TomeScanner-release.apk
            artifacts/TomeScanner-release.aab
          retention-days: 30
